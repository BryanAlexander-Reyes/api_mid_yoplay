<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light">
  <meta name="supported-color-schemes" content="light">
  <title>Código de verificación YoPlay</title>

  <style>
    @media screen and (max-width: 560px) {
      .tarjeta {
        width: 100% !important;
      }

      .contenido {
        padding-left: 20px !important;
        padding-right: 20px !important;
      }

      .codigo {
        font-size: 32px !important;
        letter-spacing: 6px !important;
      }

      .logo {
        max-width: 155px !important;
      }
    }
  </style>
</head>

<body style="margin:0; padding:0; background-color:#E8EEF7;">

  <table role="presentation" width="100%" cellpadding="0"
         cellspacing="0" border="0" bgcolor="#E8EEF7"
         style="background-color:#E8EEF7;">
    <tr>
      <td align="center" style="padding:28px 12px;">

        <!-- TARJETA PRINCIPAL -->
        <table role="presentation" class="tarjeta"
               width="480" cellpadding="0" cellspacing="0"
               border="0" bgcolor="#F5F8FC"
               style="width:480px; max-width:100%;
               background-color:#F5F8FC;
               border:1px solid #C9D8EE;
               border-radius:22px;
               border-collapse:separate;
               overflow:hidden;">

          <!-- HEADER -->
          <tr>
            <td align="center" bgcolor="#0B3FA8"
                style="padding:34px 28px 30px;
                background-color:#0B3FA8;
                border-bottom-right-radius:52px;
                text-align:center;">

              <!-- Reemplaza esta URL por la URL real de tu logo -->
              <img class="logo"
                   src="https://bryanalexander-reyes.github.io/YoPlayFrontend/images/logo.png"
                   alt="YoPlay"
                   width="170"
                   style="display:block; width:170px;
                   max-width:100%; height:auto;
                   border:0; margin:0 auto;
                   font-family:Arial,Helvetica,sans-serif;
                   font-size:36px; font-weight:bold;
                   color:#ffffff;">

              <table role="presentation" cellpadding="0"
                     cellspacing="0" border="0"
                     style="margin:18px auto 0;">
                <tr>
                  <td align="center" bgcolor="#D9F3FA"
                      style="padding:7px 18px;
                      background-color:#D9F3FA;
                      border-radius:999px;
                      color:#0A5E78;
                      font-family:Arial,Helvetica,sans-serif;
                      font-size:13px; font-weight:bold;">
                    {{proposito}}
                  </td>
                </tr>
              </table>
            </td>
          </tr>

          <!-- CONTENIDO -->
          <tr>
            <td class="contenido" align="center" bgcolor="#F5F8FC"
                style="padding:30px 28px 26px;
                background-color:#F5F8FC;">

              <p style="margin:0 0 6px;
                        font-family:Arial,Helvetica,sans-serif;
                        font-size:22px; font-weight:bold;
                        color:#0B1F4D;">
                Hola,
              </p>

              <p style="margin:0;
                        font-family:Arial,Helvetica,sans-serif;
                        font-size:15px; line-height:1.7;
                        color:#4A5B7A;">
                Estás a un paso de entrar a la cancha.
                <br>
                Tu código de verificación es:
              </p>

              <!-- CÓDIGO -->
              <table role="presentation" width="100%"
                     cellpadding="0" cellspacing="0"
                     border="0" bgcolor="#FFFFFF"
                     style="margin:24px 0 18px;
                     background-color:#FFFFFF;
                     border:1px solid #BFD3F2;
                     border-bottom:4px solid #2BB7D9;
                     border-radius:14px;
                     border-collapse:separate;">
                <tr>
                  <td align="center" class="codigo"
                      style="padding:20px 8px 20px 17px;
                      font-family:Arial,Helvetica,sans-serif;
                      font-size:40px; font-weight:bold;
                      letter-spacing:9px; color:#0B3FA8;">
                    {{codigo}}
                  </td>
                </tr>
              </table>

              <!-- VIGENCIA -->
              <table role="presentation" align="center"
                     cellpadding="0" cellspacing="0" border="0"
                     bgcolor="#E3EDFB"
                     style="margin:0 auto;
                     background-color:#E3EDFB;
                     border-radius:999px;
                     border-collapse:separate;">
                <tr>
                  <td align="center"
                      style="padding:9px 20px;
                      font-family:Arial,Helvetica,sans-serif;
                      font-size:14px; color:#0B3FA8;">
                    ⏱️ Vigencia: <strong>3 minutos</strong>
                  </td>
                </tr>
              </table>

              <!-- AVISO DE SEGURIDAD -->
              <table role="presentation" width="100%"
                     cellpadding="0" cellspacing="0"
                     border="0"
                     style="margin-top:26px;">
                <tr>
                  <td align="center"
                      style="padding-top:18px;
                      border-top:1px dashed #BFD3F2;
                      font-family:Arial,Helvetica,sans-serif;
                      font-size:13px; line-height:1.6;
                      color:#6B7C99;">
                    Si no solicitaste este código,
                    puedes ignorar este mensaje.
                  </td>
                </tr>
              </table>

            </td>
          </tr>

          <!-- FOOTER -->
          <tr>
            <td align="center" bgcolor="#0B1F4D"
                style="padding:22px 24px 24px;
                background-color:#0B1F4D;
                border-top-left-radius:52px;
                text-align:center;">

              <p style="margin:0;
                        font-family:Arial,Helvetica,sans-serif;
                        font-size:14px; line-height:1.5;
                        color:#ffffff;">
                <strong>YoPLAY</strong> - Plataforma de torneos deportivos
              </p>

              <p style="margin:12px 0 0;
                        font-size:24px; line-height:1.3;
                        letter-spacing:10px;">
                        
              </p>

              <p style="margin:10px 0 0;
                        font-family:Arial,Helvetica,sans-serif;
                        font-size:14px; font-weight:bold;
                        color:#8EDDF2;">
                Participa y Gana
              </p>

            </td>
          </tr>

        </table>

        <!-- TEXTO EXTERIOR -->
        <p style="margin:16px 0 0;
                  font-family:Arial,Helvetica,sans-serif;
                  font-size:11px; line-height:1.6;
                  color:#6B7C99; text-align:center;">
          Mensaje automático de seguridad de YoPlay.
        </p>

      </td>
    </tr>
  </table>

</body>
</html>
